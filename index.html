<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invitation · Engel &amp; Völkers Marbella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Layout: one marble "tabletop" stage; envelope centred, flips, opens, card slides out and settles beside it. Single deliberate look (no dark theme). */
:root{
  --navy:#16213a;        /* envelope */
  --navy-deep:#0f182b;   /* envelope shadow side / pocket */
  --gold:#c4a96b;        /* accent line */
  --ivory:#fbf8f2;       /* card stock */
  --ink:#1b2438;         /* card text */
  --stone:#e9e6e0;       /* marble base */
  --muted:#6b6f7a;
  --ok:#3f8f6b;
  --danger:#b4473b;
  --serif:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --sans:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stone);color:var(--ink);font-family:var(--sans);overflow:hidden}
#marble{position:fixed;inset:0;width:100%;height:100%;display:block}

/* tap-to-open hint */
.hint{position:fixed;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));z-index:15;text-align:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#4d5468;transition:opacity .4s ease;padding-inline:16px}
.hint b{font-weight:500;animation:breathe 2.2s ease-in-out infinite}
.hint.err{letter-spacing:.06em;text-transform:none;font-size:14px;color:#6b3a33}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.env.tappable{cursor:pointer}
.env.tappable:hover .front{transform:translateY(-3px)}
.front{transition:transform .3s ease}
.env:focus-visible{outline:2px solid #c4a96b;outline-offset:6px}

/* top RSVP bar */
.bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(15,24,43,.92);color:#f3efe6;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  transform:translateY(-110%);transition:transform .6s ease}
.bar.show{transform:none}
.bar button{background:none;border:0;color:var(--gold);font:inherit;letter-spacing:.14em;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.bar .done{color:#9fd3b8}

/* stage */
.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1600px}
.env{position:relative;width:var(--ew);height:var(--eh);transform-style:preserve-3d;opacity:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--navy);box-shadow:0 18px 40px rgba(20,25,35,.28),0 2px 6px rgba(20,25,35,.2);border-radius:3px;overflow:hidden}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.12))}
.front .sender{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:calc(var(--ew)*.042);color:#b9b3a6;letter-spacing:.04em}
.front .to{position:absolute;left:8%;bottom:9%;font-size:calc(var(--ew)*.019);letter-spacing:.18em;text-transform:uppercase;color:#8d8a84}
.stamp{position:absolute;top:6%;right:5%;width:15%}
.postmark{position:absolute;top:5%;right:17%;width:15%;opacity:.35}

.back{transform:rotateY(180deg)}
.back.flat{transform:none;backface-visibility:visible;-webkit-backface-visibility:visible}
.panel{position:absolute;inset:0;background:var(--navy-deep);border-radius:3px;box-shadow:0 18px 40px rgba(20,25,35,.28),0 2px 6px rgba(20,25,35,.2);z-index:1;overflow:hidden}
.panel .liner{position:absolute;inset:4% 4% 0 4%;background:var(--liner)}
.pocket{position:absolute;inset:0;z-index:3;background:var(--navy);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:3px}
.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.18))}
.back:not(.flat) .flap{transform-style:flat}
.flap{position:absolute;left:0;top:0;width:100%;height:62%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d}
.flap>div{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .out{background:linear-gradient(180deg,#1b2845,#16213a)}
.flap .in{background:var(--navy-deep);transform:rotateY(0) rotateX(180deg)}
.flap .in::before{content:"";position:absolute;inset:4% 5% 7% 5%;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--liner)}
:root{--liner:repeating-linear-gradient(45deg,rgba(196,169,107,.0) 0 9px,rgba(196,169,107,.55) 9px 10px),repeating-linear-gradient(-45deg,rgba(196,169,107,.0) 0 9px,rgba(196,169,107,.55) 9px 10px),#24365e}

/* invitation card */
.card{box-sizing:border-box;position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin-left:calc(var(--cw)/-2);margin-top:calc(var(--ch)/-2);
  z-index:2;background:var(--ivory);color:var(--ink);box-shadow:0 10px 30px rgba(20,25,35,.22);transform:rotate(90deg) scale(.8);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  padding:calc(var(--cw)*.1) calc(var(--cw)*.09);font-size:calc(var(--cw)*.04)}
.card::before{content:"";position:absolute;inset:calc(var(--cw)*.035);border:1px solid rgba(196,169,107,.7);pointer-events:none}
.card .brand{font-family:var(--serif);font-size:2.3em;letter-spacing:.32em;text-indent:.32em;font-weight:500;line-height:1}
.card .brand small{display:block;font-family:var(--sans);font-size:.24em;letter-spacing:.5em;margin-top:.7em;color:var(--muted)}
.card .mid{display:flex;flex-direction:column;align-items:center;gap:.9em}
.card .eyebrow{font-size:.62em;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.card h1{font-family:var(--serif);font-weight:500;font-size:2.15em;line-height:1.08;margin:0;text-wrap:balance}
.card .rule{width:1px;height:2.6em;background:var(--gold)}
.card .when{font-size:.72em;letter-spacing:.22em;text-transform:uppercase;line-height:1.9}
.card .foot{font-size:.55em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.8}
.card .foot b{display:block;font-weight:600;color:var(--ink);letter-spacing:.24em}

/* floating RSVP button + replay */
.side{position:fixed;z-index:20;right:calc(24px + env(safe-area-inset-right,0px));top:50%;transform:translate(20px,-50%);opacity:0;pointer-events:none;
  display:flex;flex-direction:column;gap:10px;align-items:stretch;transition:opacity .5s ease,transform .5s ease}
.side.show{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.btn{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:14px 20px;border:0;cursor:pointer;background:var(--navy);color:#fff;border-radius:2px;box-shadow:0 6px 18px rgba(15,24,43,.25)}
.btn:hover{background:#22325a}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 2px 8px rgba(15,24,43,.12)}
.btn.ghost:hover{background:#fff}
.btn:focus-visible,.bar button:focus-visible,.choice:focus-visible,.link:focus-visible,input:focus-visible,textarea:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.side a.btn{text-decoration:none;text-align:center}
@media (max-width:700px){
  .side{top:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));transform:translateY(20px);flex-direction:row}
  .side.show{transform:none}
  .side .btn{flex:1;padding:14px 10px}
}

/* RSVP modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,24,43,.45);display:flex;justify-content:flex-end}
.sheet{width:min(460px,100%);height:100%;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-sizing:border-box;background:#fff;color:var(--ink);box-shadow:-10px 0 40px rgba(15,24,43,.25);
  padding-top:calc(26px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
  padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));animation:slide .35s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sheet h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0;font-weight:600}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #e7e4de}
.who .name{font-weight:600;font-size:14px}
.choices{display:flex;gap:8px}
.choice{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;padding:11px 14px;border:1px solid #d9d5cd;background:#fff;color:var(--ink);cursor:pointer;border-radius:2px}
.choice[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.choice[aria-pressed="true"].no{background:#5e6270;border-color:#5e6270;color:#fff}
.person{padding:20px 0;border-bottom:1px solid #e7e4de;display:grid;gap:12px}
.person .ph{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.person .ph button{background:none;border:0;color:var(--danger);font:inherit;cursor:pointer;letter-spacing:.1em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:12px;color:#3a4152}
label span::after{content:" *";color:var(--ok)}
label.opt span::after{content:""}
input,textarea{font:16px var(--sans);padding:10px 11px;border:1px solid #d3cfc7;border-radius:2px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
input[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:11px;min-height:0}
.link{background:none;border:0;padding:16px 0;color:#2b5b8a;font:600 12px var(--sans);letter-spacing:.06em;cursor:pointer;text-align:left}
textarea{min-height:84px;resize:vertical;margin-top:18px}
.actions{display:flex;justify-content:flex-end;margin-top:18px;position:sticky;bottom:calc(-30px - env(safe-area-inset-bottom,0px));background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:2}
.actions .btn{min-height:48px;touch-action:manipulation}
@media (max-width:520px){.actions .btn{width:100%}}
.formerr{color:var(--danger);font-size:12px;margin-top:12px}
.thanks{text-align:center;padding:40px 4px}
.thanks h3{font-family:var(--serif);font-weight:500;font-size:32px;margin:0 0 10px}
.thanks p{color:#4b5160;line-height:1.6;font-size:14px;margin:0 auto 22px;max-width:34ch}
.demo{margin-top:22px;font-size:11px;color:var(--muted);background:#f5f3ef;padding:10px 12px;line-height:1.5}

@media (prefers-reduced-motion: reduce){.bar,.side{transition:none}.sheet{animation:none}}
</style>
</head>
<body>

<canvas id="marble" aria-hidden="true"></canvas>

<div class="bar" id="bar" role="region" aria-label="RSVP">
  <span id="barText">Please RSVP for this event</span>
  <button type="button" id="barBtn">RSVP now</button>
</div>

<main class="stage" aria-label="Invitation">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the invitation">
    <!-- FRONT OF ENVELOPE -->
    <div class="face front" aria-hidden="true">
      <svg class="postmark" viewBox="0 0 100 100"><g fill="none" stroke="#c4a96b" stroke-width="2"><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="32"/><path d="M50 30 L66 60 H34 Z"/></g></svg>
      <svg class="stamp" viewBox="0 0 100 122">
        <rect width="100" height="122" fill="#f4f1ea"/>
        <g fill="#16213a">
          <!-- perforations -->
          <g id="pt"><circle cx="0" cy="0" r="3.4"/></g>
        </g>
        <g id="perf" fill="#16213a"></g>
        <rect x="9" y="9" width="82" height="104" fill="none" stroke="#c4a96b" stroke-width="1.5"/>
        <g fill="none" stroke="#16213a" stroke-width="1.6">
          <circle cx="50" cy="48" r="16"/>
          <path d="M18 76 Q34 66 50 76 T82 76"/><path d="M18 84 Q34 74 50 84 T82 84"/>
        </g>
        <text x="50" y="103" text-anchor="middle" font-family="Montserrat, Arial" font-size="7.5" letter-spacing="2.5" fill="#16213a">E&amp;V</text>
      </svg>
      <div class="sender">Engel &amp; Völkers Marbella</div>
      <div class="to" id="toLine"></div>
    </div>

    <!-- BACK OF ENVELOPE (card inside) -->
    <div class="face back" id="back">
      <div class="panel"><div class="liner"></div></div>
      <article class="card" id="card" aria-label="Invitation card">
        <div class="brand" style="font-size:1.55em;letter-spacing:.22em;text-indent:.22em">ENGEL &amp; VÖLKERS<small>MARBELLA</small></div>
        <div class="mid">
          <div class="eyebrow" id="cEyebrow">You are invited to</div>
          <h1 id="cTitle"></h1>
          <div class="rule"></div>
          <div class="when" id="cWhen"></div>
        </div>
        <div class="foot">Hosted by<b>Engel &amp; Völkers Marbella</b></div>
      </article>
      <div class="pocket"></div>
      <div class="flap" id="flap"><div class="out"></div><div class="in"></div></div>
    </div>
  </div>
</main>

<div class="hint" id="hint" aria-live="polite"><b id="hintText">Loading invitation…</b></div>

<div class="side" id="side">
  <button class="btn" type="button" id="rsvpBtn">Submit your RSVP</button>
  <a class="btn ghost" id="calBtn" target="_blank" rel="noopener">Add to calendar</a>
  <button class="btn ghost" type="button" id="replayBtn">Replay</button>
</div>

<div class="scrim" id="scrim" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
    <header><h2 id="rsvpTitle">Submit your RSVP</h2><button class="x" type="button" id="closeBtn" aria-label="Close">×</button></header>

    <form id="form" novalidate>
      <div class="who">
        <div class="name" id="whoName">Your RSVP</div>
        <div class="choices" role="group" aria-label="Attendance">
          <button type="button" class="choice yes" id="yesBtn" aria-pressed="false">Will attend</button>
          <button type="button" class="choice no" id="noBtn" aria-pressed="false">Will not attend</button>
        </div>
      </div>
      <div id="people"></div>
      <button type="button" class="link" id="addGuest" hidden>⊕ Bring a guest</button>
      <label class="opt" for="msg"><span class="sr" hidden>Message</span>
        <textarea id="msg" placeholder="Optional message to the host"></textarea></label>
      <div class="formerr" id="formErr" role="alert"></div>
      <div class="actions"><button class="btn" type="submit" id="submitBtn">Submit RSVP</button></div>
    </form>

    <div class="thanks" id="thanks" hidden>
      <h3 id="thxTitle">Thank you</h3>
      <p id="thxText"></p>
      <button class="btn ghost" type="button" id="editBtn">Change my RSVP</button>
    </div>
  </section>
</div>

<script>
/* ===== Connection to the Invitations Database (Google Apps Script) ===== */
const API = "https://script.google.com/macros/s/AKfycbxqzBcAea5b_DGGKo-3mhSN_dkwQ0ufXIekvBzo7eNwxZvMUi874lWxQ2VBgIH749Z_/exec";
const Q = new URLSearchParams(location.search);
const INVITEE = { email:(Q.get("email")||"").trim(), name:(Q.get("name")||"").trim(), company:(Q.get("company")||"").trim() };
const LIST = (Q.get("list")||"").trim();
let INV = null, CONFIG = { maxGuests: 0 }, RSVP_ON = true;
function api(body){ return fetch(API,{method:"POST",body:JSON.stringify(body)}).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||"error"); return j; }); }
function loadInvitation(){ const id=Q.get("inv"); if(!id) return Promise.reject(new Error("missing"));
  return fetch(API+"?action=data&inv="+encodeURIComponent(id)).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||"not_found"); return j.inv; }); }
let VIEWER = INVITEE.email;
try{ if(!VIEWER){ VIEWER = localStorage.getItem("ev_viewer") || ("guest-"+Math.random().toString(36).slice(2,10)); localStorage.setItem("ev_viewer",VIEWER); } }catch(e){ VIEWER = VIEWER || ("guest-"+Math.random().toString(36).slice(2,10)); }

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- marble ---------- */
function drawMarble(){
  const c=$("marble"), dpr=Math.min(devicePixelRatio||1,2), w=innerWidth, h=innerHeight;
  c.width=w*dpr; c.height=h*dpr; const g=c.getContext("2d"); g.scale(dpr,dpr);
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  g.fillStyle="#ecebe6"; g.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){ const x=rnd()*w,y=rnd()*h,r=80+rnd()*320;
    const gr=g.createRadialGradient(x,y,0,x,y,r); const t=rnd()>.5?"255,255,252":"214,210,200";
    gr.addColorStop(0,`rgba(${t},.45)`); gr.addColorStop(1,`rgba(${t},0)`); g.fillStyle=gr; g.fillRect(0,0,w,h); }
  const vein=(x,y,ang,len,width,alpha,depth)=>{
    g.beginPath(); g.moveTo(x,y);
    for(let i=0;i<len;i++){ ang+=(rnd()-.5)*.35; x+=Math.cos(ang)*6; y+=Math.sin(ang)*6; g.lineTo(x,y);
      if(depth<2 && rnd()<.012) vein(x,y,ang+(rnd()-.5)*1.4,len*.4|0,width*.6,alpha*.8,depth+1); }
    g.strokeStyle=`rgba(150,138,118,${alpha})`; g.lineWidth=width; g.lineCap="round"; g.stroke();
  };
  g.filter="blur(1.4px)";
  for(let i=0;i<9;i++) vein(-40, rnd()*h*1.2-h*.1, -.35+rnd()*.5, 140+rnd()*160, .6+rnd()*1.6, .18+rnd()*.25, 0);
  g.filter="blur(0.4px)";
  for(let i=0;i<14;i++) vein(rnd()*w, rnd()*h, rnd()*6.28, 30+rnd()*80, .4+rnd()*.6, .14+rnd()*.15, 1);
  g.filter="none";
}

/* ---------- sizing ---------- */
/* The card is drawn at its final (largest) size and scaled DOWN while inside the envelope, so text stays sharp. */
let EW,EH,CW,CH,SF=1,K=1;
const isWide=()=>innerWidth>700 && innerWidth>innerHeight*1.05;
function finalScale(){ const vw=innerWidth, vh=innerHeight;
  return isWide() ? Math.min(1.25,(vh*.8)/CH,(vw*.9-EW*.85)/CW) : Math.min(1.35,(vw*.82)/CW,(vh*.68)/CH); }
function size(){
  const vw=innerWidth, vh=innerHeight;
  EW=Math.min(540, vw*.84, vh*1.05); EH=EW*.69; CW=EH*.88; CH=EW*.9;
  SF=finalScale(); K=1/SF;
  const r=document.documentElement.style;
  r.setProperty("--ew",EW+"px"); r.setProperty("--eh",EH+"px"); r.setProperty("--cw",(CW*SF)+"px"); r.setProperty("--ch",(CH*SF)+"px");
  if(!opened && !running) card.style.transform=`rotate(90deg) scale(${K})`;
  drawMarble();
}
function finalPose(){
  const vw=innerWidth, vh=innerHeight, wide=isWide();
  if(wide){
    const s=SF;
    const total=EW + CW*s - EW*.15, envX=-total/2+EW/2, cardX=total/2-CW*s/2;
    const dy=EH*.16;
    return { env:`translate(${envX}px, ${dy}px)`, card:`translate(${cardX-envX}px, ${-dy}px) rotate(0deg)`, envOpacity:1 };
  }
  return { env:`translateY(${EH*.35}px)`, card:`translate(0, ${-EH*.42}px) rotate(0deg)`, envOpacity:.85 };
}

/* ---------- animation ---------- */
const env=$("env"), back=$("back"), flap=$("flap"), card=$("card");
let running=false, opened=false;
const anim=(el,kf,o)=>el.animate(kf,Object.assign({fill:"forwards",easing:"cubic-bezier(.45,.05,.25,1)"},o)).finished;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function reset(){
  [env,back,flap,card].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  env.style.transformStyle="preserve-3d"; back.classList.remove("flat");
  env.querySelector(".front").hidden=false;
  flap.style.zIndex=4; card.style.zIndex=2; env.style.opacity=0;
  $("side").classList.remove("show"); $("bar").classList.remove("show"); opened=false;
}
function showFinal(){
  const p=finalPose();
  env.querySelector(".front").hidden=true; back.classList.add("flat"); env.style.transformStyle="flat";
  env.style.opacity=1; flap.style.zIndex=0; card.style.zIndex=5;
  [env,back,flap,card].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  flap.style.transform="rotateX(180deg)"; card.style.transform=p.card; env.style.transform=p.env; env.style.opacity=p.envOpacity;
  revealUi();
}
function revealUi(){ opened=true; $("bar").classList.add("show"); $("side").classList.add("show"); }

async function arrive(){
  reset(); env.style.transform=""; card.style.transform=`rotate(90deg) scale(${K})`; flap.style.transform="";
  if(reduce){ env.style.opacity=1; return; }
  await anim(env,[{opacity:0,transform:"translateY(30px) scale(.94)"},{opacity:1,transform:"none"}],{duration:900,easing:"ease-out"});
  env.getAnimations().forEach(a=>a.cancel()); env.style.opacity=1; env.style.transform="none";
}
async function play(){
  if(running||opened) return; running=true;
  env.classList.remove("tappable"); $("hint").style.opacity=0;
  const p=finalPose();
  // 2. turn it over
  if(reduce){ // gentle version for "Reduce Motion": fade to the back instead of a 3D turn
    await anim(env,[{opacity:1},{opacity:0}],{duration:350,easing:"ease-in"});
  } else {
    await anim(env,[{transform:"rotateY(0deg)"},{transform:"rotateY(-8deg) rotateX(4deg)",offset:.15},{transform:"rotateY(180deg)"}],{duration:1300});
  }
  // swap to flat back so layers stack correctly
  env.getAnimations().forEach(a=>a.cancel()); env.style.transform="none"; env.style.transformStyle="flat";
  env.querySelector(".front").hidden=true; back.classList.add("flat");
  if(reduce) await anim(env,[{opacity:0},{opacity:1}],{duration:350,easing:"ease-out"});
  await wait(250);
  // 3. open the flap
  const fa=anim(flap,[{transform:"perspective(900px) rotateX(0deg)"},{transform:"perspective(900px) rotateX(180deg)"}],{duration:900,easing:"ease-in-out"});
  await wait(470); flap.style.zIndex=0; await fa;
  // 4. card slides up out of the envelope
  await anim(card,[{transform:`translateY(0) rotate(90deg) scale(${K})`},{transform:`translateY(${-EH*.95}px) rotate(90deg) scale(${K})`}],{duration:1000});
  card.style.zIndex=5;
  // 5. card turns upright and comes forward
  await anim(card,[{transform:`translateY(${-EH*.95}px) rotate(90deg) scale(${K})`},{transform:`translateY(${-EH*.1}px) rotate(0deg) scale(${K*1.02})`}],{duration:900});
  // 6. settle side by side
  anim(env,[{transform:"none",opacity:1},{transform:p.env,opacity:p.envOpacity}],{duration:1000});
  await anim(card,[{transform:`translateY(${-EH*.1}px) rotate(0deg) scale(${K*1.02})`},{transform:p.card}],{duration:1000});
  revealUi(); running=false;
}

/* ---------- RSVP form ---------- */
const people=$("people"); let attending=null, guestCount=0;
const fields=[["first","First name"],["last","Last name"],["email","Email","email"],["phone","Phone","tel"],["company","Company"]];
function personBlock(idx){
  const isGuest=idx>0, d=document.createElement("div"); d.className="person"; d.dataset.idx=idx;
  d.innerHTML=`<div class="ph"><span>${isGuest?"Guest":"Your details"}</span>${isGuest?'<button type="button" data-remove>Remove</button>':""}</div>
    <div class="row">${field(idx,"first","First name")}${field(idx,"last","Last name")}</div>
    ${field(idx,"email","Email","email")}
    <div class="row">${field(idx,"phone","Phone","tel")}${field(idx,"company","Company")}</div>`;
  if(isGuest) d.querySelector("[data-remove]").onclick=()=>{ d.remove(); guestCount--; updateGuestBtn(); };
  return d;
}
function field(i,k,label,type="text"){
  const id=`f${i}_${k}`, auto={first:"given-name",last:"family-name",email:"email",phone:"tel",company:"organization"}[k];
  return `<label for="${id}"><span>${label}</span><input id="${id}" name="${k}" type="${type}" autocomplete="${i?"off":auto}" required><em class="err" id="${id}_e"></em></label>`;
}
function setAttend(v){
  attending=v; $("yesBtn").setAttribute("aria-pressed",v===true); $("noBtn").setAttribute("aria-pressed",v===false);
  $("formErr").textContent="";
  if(v && !people.children.length){
    const b=personBlock(0); people.appendChild(b);
    const [fn,...ln]=(INVITEE.name||"").split(" ");
    b.querySelector("#f0_first").value=fn||""; b.querySelector("#f0_last").value=ln.join(" ");
    b.querySelector("#f0_email").value=INVITEE.email||""; b.querySelector("#f0_company").value=INVITEE.company||"";
  }
  if(!v){ people.innerHTML=""; guestCount=0; }
  updateGuestBtn();
}
function updateGuestBtn(){ $("addGuest").hidden = !attending || guestCount>=CONFIG.maxGuests; }
$("yesBtn").onclick=()=>setAttend(true);
$("noBtn").onclick=()=>setAttend(false);
$("addGuest").onclick=()=>{ guestCount++; const b=personBlock(Date.now()%100000); people.appendChild(b); updateGuestBtn(); b.querySelector("input").focus(); };

function validate(){
  let ok=true;
  people.querySelectorAll("input").forEach(inp=>{
    const e=$(inp.id+"_e"); let m="";
    const v=inp.value.trim();
    if(!v) m="Required";
    else if(inp.type==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) m="Enter a valid email address";
    else if(inp.type==="tel" && v.replace(/\D/g,"").length<7) m="Enter a valid phone number";
    e.textContent=m; inp.setAttribute("aria-invalid",!!m); if(m && ok){ ok=false; inp.focus(); }
  });
  return ok;
}
function collect(){
  const ps=[...people.querySelectorAll(".person")].map(p=>Object.fromEntries([...p.querySelectorAll("input")].map(i=>[i.name,i.value.trim()])));
  return { invId:INV.id, inviteeEmail:INVITEE.email||"", inviteeName:INVITEE.name||"", viewerId:VIEWER, attending, people:ps, message:$("msg").value.trim() };
}
function send(payload){
  return new Promise((res,rej)=>{
    api({action:"rsvp",payload}).then(res,rej);
  });
}
$("form").onsubmit=async e=>{
  e.preventDefault(); $("formErr").textContent="";
  if(attending===null){ $("formErr").textContent="Choose “Will attend” or “Will not attend” to continue."; return; }
  if(attending && !validate()) return;
  const btn=$("submitBtn"); btn.disabled=true; btn.textContent="Sending…";
  try{
    const data=collect(); await send(data);
    const first=(data.people[0]&&data.people[0].first)||INVITEE.name.split(" ")[0]||"";
    $("thxTitle").textContent= attending ? "See you there" : "Thank you";
    $("thxText").textContent= attending
      ? `${first?first+", your":"Your"} RSVP is confirmed${data.people.length>1?" for you and your guest":""}. We'll send you the final details closer to the date.`
      : `${first?first+", we":"We"}'re sorry you can't join us. Thank you for letting us know.`;
    $("form").hidden=true; $("thanks").hidden=false;
    $("barText").innerHTML = attending ? '<span class="done">✓ You are attending</span>' : '<span class="done">✓ RSVP received</span>';
    $("barBtn").textContent="Change RSVP"; $("rsvpBtn").textContent="Change your RSVP";
  }catch(err){
    $("formErr").textContent="Your RSVP could not be sent. Check your connection and try again.";
  }finally{ btn.disabled=false; btn.textContent="Submit RSVP"; }
};

/* ---------- open / close modal ---------- */
let lastFocus=null;
function openRsvp(){ lastFocus=document.activeElement; $("scrim").hidden=false; setTimeout(()=>($("thanks").hidden?$("yesBtn"):$("editBtn")).focus(),50); }
function closeRsvp(){ $("scrim").hidden=true; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
$("rsvpBtn").onclick=openRsvp; $("barBtn").onclick=openRsvp; $("closeBtn").onclick=closeRsvp;
$("scrim").onclick=e=>{ if(e.target===$("scrim")) closeRsvp(); };
addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("scrim").hidden) closeRsvp(); });
$("editBtn").onclick=()=>{ $("thanks").hidden=true; $("form").hidden=false; $("yesBtn").focus(); };
$("replayBtn").onclick=async()=>{ if(running) return; await arrive(); await wait(400); play(); };

/* ---------- boot ---------- */
function fillInvitation(){
  CONFIG.maxGuests = INV.maxGuests; RSVP_ON = /rsvp/i.test(INV.type);
  document.title = INV.title + " · Engel & Völkers Marbella";
  $("cEyebrow").textContent = /save the date/i.test(INV.type) ? "Save the date" : "You are invited to";
  $("cTitle").textContent = INV.title;
  $("cWhen").innerHTML = [INV.dateText, INV.time && INV.time!=="TBC" ? INV.time : "Time to be confirmed", INV.location].filter(Boolean).map(t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))).join("<br>");
  const d=(INV.dateIso||"").replace(/-/g,""); const m=/^(\d{1,2})[:.](\d{2})/.exec(INV.time||"");
  let dates="";
  if(d && m){ const h=+m[1], mi=m[2]; const pad=n=>String(n).padStart(2,"0"); dates=`${d}T${pad(h)}${mi}00/${d}T${pad(Math.min(23,h+3))}${mi}00&ctz=Europe/Madrid`; }
  else if(d){ const nd=new Date(INV.dateIso+"T12:00:00"); nd.setDate(nd.getDate()+1); dates=`${d}/${nd.toISOString().slice(0,10).replace(/-/g,"")}`; }
  if(dates) $("calBtn").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(INV.title)+"&dates="+dates+"&location="+encodeURIComponent(INV.location||"")+"&details="+encodeURIComponent("Hosted by Engel & Völkers Marbella");
  else $("calBtn").hidden=true;
  if(!RSVP_ON){ $("rsvpBtn").hidden=true; $("barBtn").hidden=true; $("barText").textContent=INV.title; }
}
(function(){
  if(INVITEE.name){ $("whoName").textContent=INVITEE.name; $("toLine").textContent="For "+INVITEE.name; }
  const perf=document.getElementById("perf"); let s="";
  for(let x=0;x<=100;x+=8.33){ s+=`<circle cx="${x}" cy="0" r="3.2"/><circle cx="${x}" cy="122" r="3.2"/>`; }
  for(let y=0;y<=122;y+=8.13){ s+=`<circle cx="0" cy="${y}" r="3.2"/><circle cx="100" cy="${y}" r="3.2"/>`; }
  perf.innerHTML=s; document.getElementById("pt").remove();
  size();
  let t; addEventListener("resize",()=>{ clearTimeout(t); t=setTimeout(()=>{ size(); if(opened && !running) showFinal(); },150); });
  const touch = matchMedia("(hover: none)").matches;
  const ready = loadInvitation().then(inv=>{ INV=inv; fillInvitation();
      api({action:"view", invId:INV.id, viewerId:VIEWER, list:LIST}).catch(()=>{});   // automatic open tracking
      return true; });
  const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
  fonts.then(arrive).then(()=>ready).then(()=>{
    $("hintText").textContent = touch ? "Tap the envelope to open" : "Click the envelope to open";
    env.classList.add("tappable");
    const go=()=>play();
    env.addEventListener("click",go);
    env.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  }).catch(err=>{
    const h=$("hint"); h.classList.add("err");
    $("hintText").textContent = err && err.message==="missing" ? "This link is incomplete. Please use the button in your invitation email."
      : err && /not_found|archived/.test(err.message) ? "This invitation is no longer available."
      : "The invitation couldn’t be loaded. Check your connection and refresh the page.";
  });
})();
</script>
